[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dustmaps3d-backend"
version = "0.1.0"
description = "Standalone FastAPI backend for dust maps and astronomy tools"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.18",
  "numpy>=1.26,<2", "pandas>=2.0,<3", "pyarrow>=20,<24", "astropy>=6,<7",
  "astropy-healpix>=1.0,<2", "scipy>=1.13,<1.14", "healpy>=1.17,<2",
  "matplotlib>=3.8,<3.10", "cmasher>=1.8,<2", "dustmaps3d==2.2.13",
  "xp-extinction-toolkit==1.0", "extinction-coefficient==1.8"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
dustmaps-db = "dustmaps_backend.database:cli"

[tool.setuptools.packages.find]
include = ["dustmaps_backend*"]
